l_english:
 ch_create_custom_hegemony_decision: "Proclaim a High Kingdom"
 ch_create_custom_hegemony_decision_desc: "My imperial crowns no longer reflect the true reach of my authority. I will bind them beneath one high kingdom, bearing the name and arms of my realm."
 ch_create_custom_hegemony_decision_tooltip: "Create a new [hegemony|E] above all your held [empire|E] titles"
 ch_create_custom_hegemony_decision_confirm: "Proclaim the High Kingdom"
 CH_CUSTOM_HEGEMONY_TITLE_NAME: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 CH_CUSTOM_HEGEMONY_TITLE_ADJ: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 st_unite_isles_and_rivers_decision: "Unite the Isles and Rivers"
 st_unite_isles_and_rivers_decision_desc: "The black rivers and the iron shores once answered to a single crown. I will bind the Riverlands and the Iron Islands together again as the Kingdom of the Isles and Rivers."
 st_unite_isles_and_rivers_decision_tooltip: "Unite the Iron Islands and the Riverlands beneath one high kingdom"
 st_unite_isles_and_rivers_decision_confirm: "Raise the Black Crown"
 ST_ISLES_AND_RIVERS_TITLE_NAME: "the Kingdom of the Isles and Rivers"
 ST_ISLES_AND_RIVERS_TITLE_ADJ: "Isles-and-Rivers"
 st_form_western_essos_decision: "Unite Western Essos"
 st_form_western_essos_decision_desc: "The Narrow Sea and the Braavosi lands of Daoryrdembos command the western marches of Essos. Beneath one crown they will become a power no Free City can ignore."
 st_form_western_essos_decision_tooltip: "Unite the Narrow Sea and Daoryrdembos as Western Essos"
 st_form_western_essos_decision_confirm: "Proclaim Western Essos"
 ST_WESTERN_ESSOS_TITLE_NAME: "Western Essos"
 ST_WESTERN_ESSOS_TITLE_ADJ: "Western Essosi"
 st_high_prince_male: "High Prince"
 st_high_prince_female: "High Princess"
 trait_st_prince_of_princes: "Prince of Princes"
 trait_st_prince_of_princes_desc: "This character commands the lords, magisters, and captains of Western Essos as first among its princes."
 trait_st_prince_of_princes_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] commands the lords, magisters, and captains of Western Essos as first among its princes."
 supertitles.1000.t: "Prince of Princes"
 supertitles.1000.desc: "The crown of Western Essos has passed into my hands. From the Narrow Sea to the misty canals of Braavos, lords, magisters, and captains now look to one ruler. I shall stand above the princes of the Essosi west and guard the realm they share."
 supertitles.1000.a: "The West bows to one ruler."
 k_flints_finger: "Lordship of Flint's Finger"
 k_flints_finger_adj: "Flint's Finger"
 e_the_bite: "The Bite"
 e_the_bite_adj: "Bite"
h_hand_kingdom: "Kingdom of the Hand"
 h_hand_kingdom_adj: "Hand"
 st_restore_gulltown_lordship_decision: "Restore the Lordship of Gulltown"
 st_restore_gulltown_lordship_decision_desc: "Gulltown's wealth and ancient standing merit a lordship of its own. I shall raise its banners above the Vale's eastern coast."
 st_restore_gulltown_lordship_decision_tooltip: "Create the Lordship of Gulltown, make Gulltown its de jure duchy, and gain 1,000 Dynasty Renown"
st_restore_gulltown_lordship_decision_confirm: "Restore the Lordship"
st_restore_flints_finger_lordship_decision: "Restore the Lordship of Flint's Finger"
st_restore_flints_finger_lordship_decision_desc: "The Flint's Finger and the Lakelands shall answer to one lordship, restoring an ancient northern dignity."
st_restore_flints_finger_lordship_decision_tooltip: "Create the Lordship of Flint's Finger, make Flint's Finger and the Lakelands its de jure duchies, and gain 350 Dynasty Renown"
st_restore_flints_finger_lordship_decision_confirm: "Restore the Northern Lordship"
st_restore_bear_island_lordship_decision: "Restore the Lordship of Bear Island"
st_restore_bear_island_lordship_decision_desc: "Bear Island's ancient lordship shall rise again beneath my banner."
st_restore_bear_island_lordship_decision_tooltip: "Create the Lordship of Bear Island and gain 400 Dynasty Renown"
st_restore_bear_island_lordship_decision_confirm: "Restore Bear Island's Lordship"
 st_restore_bronze_lordship_decision: "Restore the Bronze Lordship"
 st_restore_bronze_lordship_decision_desc: "The Bronze Kings once ruled from Runestone. Their ancient dignity shall be restored beneath my banner."
 st_restore_bronze_lordship_decision_tooltip: "Create the Lordship of Runestone, make Runestone its de jure duchy, and gain 500 Dynasty Renown"
 st_restore_bronze_lordship_decision_confirm: "Raise the Bronze Crown"
 st_restore_sisters_lordship_decision: "Restore the Lordship of the Sisters"
 st_restore_sisters_lordship_decision_desc: "The three Sisters shall answer to one lordship and one crown, guarded by the Bite and the cold sea."
 st_restore_sisters_lordship_decision_tooltip: "Create the Lordship of the Sisters, make the Sisters its de jure duchy, and gain 250 Dynasty Renown"
 st_restore_sisters_lordship_decision_confirm: "Unite the Sisters"
 st_restore_fair_isle_lordship_decision: "Restore the Lordship of Fair Isle"
 st_restore_fair_isle_lordship_decision_desc: "Fair Isle has stood apart from the mainland since the days of the old kings. Its lordship shall rise again."
 st_restore_fair_isle_lordship_decision_tooltip: "Create the Lordship of Fair Isle, make Fair Isle its de jure duchy, and gain 500 Dynasty Renown"
st_restore_fair_isle_lordship_decision_confirm: "Restore the Island Lordship"
st_create_bite_empire_decision: "Create the Bite"
st_create_bite_empire_decision_desc: "The White Knife, the Neck, and the Bite guard the northern sea-roads and the way to White Harbor. Joined beneath one crown, they shall form a shield of the North and a bulwark of the Iron Throne; if the Sisters have been united, their isles shall join the realm as well."
st_create_bite_empire_decision_tooltip: "Proclaim the Bite as an empire beneath the Iron Throne, uniting the White Knife, the Neck, the Bite, and the Sisters if they have been formed"
st_create_bite_empire_decision_confirm: "Proclaim the Bite"
st_restore_stepstones_empire_decision: "Annex the Stepstones to Dorne"
st_restore_stepstones_empire_decision_desc: "With every island secured and the pirate lords driven out, Dorne can bring the Stepstones into its realm."
st_restore_stepstones_empire_decision_tooltip: "Make the Stepstones de jure part of Dorne"
st_restore_stepstones_empire_decision_confirm: "Claim the Stepstones for Dorne"
 st_stepstones_no_landed_pirates_requirement: "No landed ruler within the Stepstones is a pirate"
 st_proclaim_kingdom_of_the_hand_decision: "Proclaim the Kingdom of the Hand"
st_proclaim_kingdom_of_the_hand_decision_desc: "Dorne and the lands of the Narrow Sea shall form one realm: the Kingdom of the Hand."
st_proclaim_kingdom_of_the_hand_decision_tooltip: "Unite Dorne and the Narrow Sea beneath the Kingdom of the Hand"
 st_proclaim_kingdom_of_the_hand_decision_confirm: "Close the Hand"
