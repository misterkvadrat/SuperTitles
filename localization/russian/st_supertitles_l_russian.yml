l_russian:
 ch_create_custom_hegemony_decision: "Провозгласить верховное королевство"
 ch_create_custom_hegemony_decision_desc: "Мои императорские короны больше не отражают истинный размах моей власти. Я объединю их в одно верховное королевство, носящее имя и герб моей державы."
 ch_create_custom_hegemony_decision_tooltip: "Создать новую [hegemony|El] над всеми вашими титулами уровня [empire|El]"
 ch_create_custom_hegemony_decision_confirm: "Провозгласить верховное королевство"
 CH_CUSTOM_HEGEMONY_TITLE_NAME: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 CH_CUSTOM_HEGEMONY_TITLE_ADJ: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 st_unite_isles_and_rivers_decision: "Объединить Острова и Реки"
 st_unite_isles_and_rivers_decision_desc: "Чёрные реки и железные берега некогда подчинялись одной короне. Я вновь объединю Речные земли и Железные острова в Королевство Островов и Рек."
 st_unite_isles_and_rivers_decision_tooltip: "Объединить Железные острова и Речные земли под властью одного верховного королевства"
 st_unite_isles_and_rivers_decision_confirm: "Поднять Чёрную корону"
 ST_ISLES_AND_RIVERS_TITLE_NAME: "Королевство Островов и Рек"
 ST_ISLES_AND_RIVERS_TITLE_ADJ: "Островов и Рек"
 st_form_western_essos_decision: "Объединить Западный Эссос"
 st_form_western_essos_decision_desc: "Узкое море и браавосийские земли Даорирдембоса властвуют над западными рубежами Эссоса. Под одной короной они станут силой, которую не сможет игнорировать ни один Вольный город."
 st_form_western_essos_decision_tooltip: "Объединить Узкое море и Даорирдембос в Западный Эссос"
 st_form_western_essos_decision_confirm: "Провозгласить Западный Эссос"
 ST_WESTERN_ESSOS_TITLE_NAME: "Западный Эссос"
 ST_WESTERN_ESSOS_TITLE_ADJ: "Западноэссосск"
 st_high_prince_male: "Верховный принц"
 st_high_prince_female: "Верховная принцесса"
 trait_st_prince_of_princes: "Принц принцев"
 trait_st_prince_of_princes_desc: "Этот персонаж повелевает лордами, магистрами и капитанами Западного Эссоса как первый среди его принцев."
 trait_st_prince_of_princes_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] повелевает лордами, магистрами и капитанами Западного Эссоса как первый среди его принцев."
 supertitles.1000.t: "Принц принцев"
 supertitles.1000.desc: "Корона Западного Эссоса перешла в мои руки. От Узкого моря до туманных каналов Браавоса лорды, магистры и капитаны теперь взирают на одного правителя. Я встану над принцами западного Эссоса и стану хранителем их общей державы."
 supertitles.1000.a: "Запад склонится перед одним правителем."
 k_flints_finger: "Лордство Кремневого Пальца"
 k_flints_finger_adj: "Кремне-палецск"
 e_the_bite: "Пасть"
 e_the_bite_adj: "Пастьск"
h_hand_kingdom: "Королевство Руки"
 h_hand_kingdom_adj: "Рукск"
 st_restore_gulltown_lordship_decision: "Восстановить лордство Чаячьего города"
 st_restore_gulltown_lordship_decision_desc: "Богатство и древнее положение Чаячьего города достойны собственного лордства. Я подниму его знамёна над восточным побережьем Долины."
 st_restore_gulltown_lordship_decision_tooltip: "Создать лордство Чаячьего города, де-юре включить в него герцогство Чаячьего города и получить 1000 признания"
st_restore_gulltown_lordship_decision_confirm: "Восстановить лордство"
st_restore_flints_finger_lordship_decision: "Восстановить лордство Кремневого Пальца"
st_restore_flints_finger_lordship_decision_desc: "Кремневый Палец и Озёрные земли будут подчиняться одному лордству, возвращая древнее северное достоинство."
st_restore_flints_finger_lordship_decision_tooltip: "Создать лордство Кремневого Пальца, де-юре включить в него Кремневый Палец и Озёрные земли и получить 350 признания династии"
st_restore_flints_finger_lordship_decision_confirm: "Восстановить северное лордство"
st_restore_bear_island_lordship_decision: "Восстановить лордство Медвежьего острова"
st_restore_bear_island_lordship_decision_desc: "Древнее лордство Медвежьего острова вновь восстанет под моим знаменем."
st_restore_bear_island_lordship_decision_tooltip: "Создать лордство Медвежьего острова и получить 400 признания династии"
st_restore_bear_island_lordship_decision_confirm: "Восстановить лордство Медвежьего острова"
 st_restore_bronze_lordship_decision: "Восстановить Бронзовое лордство"
 st_restore_bronze_lordship_decision_desc: "Бронзовые короли некогда правили из Рунного Камня. Их древнее достоинство будет восстановлено под моим знаменем."
 st_restore_bronze_lordship_decision_tooltip: "Создать лордство Рунного Камня, де-юре включить в него герцогство Рунного Камня и получить 500 признания"
 st_restore_bronze_lordship_decision_confirm: "Поднять Бронзовую корону"
 st_restore_sisters_lordship_decision: "Восстановить лордство Сестёр"
 st_restore_sisters_lordship_decision_desc: "Три Сестры будут подчиняться одному лордству и одной короне, защищённым Клешнёй и холодным морем."
 st_restore_sisters_lordship_decision_tooltip: "Создать лордство Сестёр, де-юре включить в него герцогство Сестёр и получить 250 признания"
 st_restore_sisters_lordship_decision_confirm: "Объединить Сестёр"
 st_restore_fair_isle_lordship_decision: "Восстановить лордство Светлого острова"
 st_restore_fair_isle_lordship_decision_desc: "Светлый остров стоит особняком от материка со времён древних королей. Его лордство восстанет вновь."
 st_restore_fair_isle_lordship_decision_tooltip: "Создать лордство Светлого острова, де-юре включить в него одноимённое герцогство и получить 500 признания"
st_restore_fair_isle_lordship_decision_confirm: "Восстановить островное лордство"
st_create_bite_empire_decision: "Создать Пасть"
st_create_bite_empire_decision_desc: "Белый Нож, Перешеек и Пасть издревле стерегут северные морские пути и дорогу к Белой Гавани. Объединённые одной короной, они станут щитом Севера и опорой Железного трона; если Сёстры уже сведены под одним знаменем, их острова также войдут в державу."
st_create_bite_empire_decision_tooltip: "Провозгласить Пасть империей под верховенством Железного трона, объединив Белый Нож, Перешеек, Пасть и созданное лордство Сестёр"
st_create_bite_empire_decision_confirm: "Провозгласить Пасть"
st_restore_stepstones_empire_decision: "Присоединить Ступени к Дорну"
st_restore_stepstones_empire_decision_desc: "Когда каждый остров покорён, а пиратские лорды изгнаны, Дорн может включить Ступени в свои владения."
st_restore_stepstones_empire_decision_tooltip: "Включить Ступени в де-юре состав Дорна"
st_restore_stepstones_empire_decision_confirm: "Присоединить Ступени к Дорну"
 st_stepstones_no_landed_pirates_requirement: "На Ступенях не должно быть ни одного пирата-землевладельца"
 st_proclaim_kingdom_of_the_hand_decision: "Провозгласить Королевство Руки"
st_proclaim_kingdom_of_the_hand_decision_desc: "Дорн и земли Узкого моря составят единую державу: Королевство Руки."
st_proclaim_kingdom_of_the_hand_decision_tooltip: "Объединить Дорн и Узкое море под властью Королевства Руки"
 st_proclaim_kingdom_of_the_hand_decision_confirm: "Сжать Руку"
